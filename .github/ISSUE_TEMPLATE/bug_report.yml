name: Bug 报告
description: 报告可复现的功能、数据或交互问题
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请删除日志中的令牌、Cookie、真实笔记正文和其他敏感信息。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？它影响了哪个产品链路？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 选择…
        3. 点击…
        4. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 可能涉及的层
      options:
        - Web UI
        - API / D1
        - Knowledge Engine
        - Contracts
        - Build / Deployment
        - 不确定
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: 提交或版本
      placeholder: 例如 4684685
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、浏览器、Node 版本、页面地址。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已移除凭据、Cookie、私人笔记和其他敏感信息。
          required: true
        - label: 这不是需要私密处理的安全漏洞。
          required: true
